[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "courseflow"
version = "0.3.0"
description = "本地课表工具: 壁纸,日历,挂图,组队与可校对的 AI 导入"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "yeqi" }]
dependencies = [
    "pillow>=10.1",
    "openpyxl>=3.1",
    "PyYAML>=6",
    "customtkinter>=5.2,<7",
]

[project.optional-dependencies]
documents = ["pypdf>=5"]
build = ["pyinstaller>=6.16"]

[project.urls]
Repository = "https://gitee.com/yeqi728/courseflow"
GitHub = "https://github.com/inori728/courseflow"

[project.scripts]
term = "courseflow.cli:main"

[project.gui-scripts]
courseflow-gui = "courseflow.gui:main"

[tool.setuptools.packages.find]
include = ["courseflow", "courseflow.*"]

[tool.setuptools.package-data]
courseflow = ["data/*.yaml", "data/*.json", "data/*.md", "data/*.html", "data/*.png", "data/*.ico"]
