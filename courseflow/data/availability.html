<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>CourseFlow / 忙闲点格页</title>
  <script id="courseflow-defaults" type="application/json">{}</script>
  <style>
    :root{font-family:system-ui,"Microsoft YaHei",sans-serif;color:#20304b;background:#f3f6fc;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0}main{max-width:980px;margin:0 auto;padding:36px 22px 50px}
    .brand{font-size:14px;font-weight:700;color:#4866e8;letter-spacing:.04em}.brand b{display:inline-grid;place-items:center;width:34px;height:34px;background:#4866e8;color:white;border-radius:10px;margin-right:9px}
    h1{font-size:35px;letter-spacing:-.04em;margin:26px 0 10px}p{line-height:1.7;color:#718099;font-size:14px;margin:8px 0 22px}
    .panel{background:white;border:1px solid #e2e8f3;border-radius:20px;padding:25px;margin:20px 0;box-shadow:0 9px 28px #26385a05}
    .fields{display:grid;grid-template-columns:1.2fr 1fr .7fr;gap:18px}.field label{font-size:13px;display:block;margin-bottom:8px;font-weight:600}
    input,textarea{font:inherit;color:#263754;border:1px solid #dce3f1;border-radius:9px;padding:12px;background:#fcfdff;width:100%;min-width:0;outline:none}
    input:focus,textarea:focus{border-color:#6c84ed;box-shadow:0 0 0 3px #4866e813}input[type=checkbox]{width:17px;height:17px;accent-color:#4866e8}
    .toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin:21px 0 13px}.check{display:flex;gap:9px;align-items:center;font-size:13px;line-height:1.6}
    button{font:inherit;border:0;border-radius:9px;padding:11px 17px;cursor:pointer;background:#ecf0fa;color:#49618d;font-size:13px;font-weight:600}
    button:hover{filter:brightness(.97)}button:focus-visible{outline:3px solid #899df1;outline-offset:2px}.primary{background:#4866e8;color:white}button:disabled{opacity:.45;cursor:not-allowed}
    #grid{display:grid;grid-template-columns:36px repeat(7,minmax(0,1fr));gap:6px;user-select:none}.weekday,.period{display:grid;place-items:center;font-size:12px;color:#7a87a0;min-height:27px}
    .cell{padding:0;min-height:37px;border:1px solid #e5ebf5;background:#f4f7fc;color:#a2aec2;border-radius:6px;font-size:11px;font-weight:500;touch-action:manipulation}
    .cell[aria-pressed=true]{background:#dce4ff;color:#395ac1;border-color:#aabcfa}.legend{font-size:12px;color:#7c8ba2;margin-top:14px;display:flex;justify-content:space-between;gap:10px}
    .dot{display:inline-block;width:10px;height:10px;background:#dce4ff;border:1px solid #aabcfa;border-radius:3px;margin-right:5px}h2{font-size:18px;margin:0 0 12px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
    #output{display:none}textarea{height:120px;font:12px/1.6 ui-monospace,monospace;resize:vertical;word-break:break-all}.status{min-height:24px;margin-top:15px;font-size:13px;color:#b44444}.foot{font-size:12px;color:#8995ab;text-align:center;margin:25px}
    @media(max-width:600px){main{padding:23px 12px 35px}h1{font-size:28px}.panel{padding:17px 12px;border-radius:15px}.fields{grid-template-columns:1fr 1fr;gap:13px}.field:first-child{grid-column:1/-1}.cell{min-height:34px}#grid{gap:4px;grid-template-columns:25px repeat(7,minmax(0,1fr))}.toolbar{font-size:12px}.check{font-size:12px}.legend{font-size:11px}.primary{padding:12px 18px}}
  </style>
</head>
<body>
<main>
  <div class="brand"><b>CF</b> CourseFlow</div>
  <h1>点出忙碌, 留下共同空闲</h1>
  <p>不需要安装或登录. 点选本周有课或已有安排的格子, 生成忙闲卡后自行发给组长.<br>内容只在当前浏览器处理, 卡片不包含课程名称和教室.</p>
  <section class="panel">
    <div class="fields">
      <div class="field"><label for="name">组队时使用的名称</label><input id="name" maxlength="80" placeholder="例如: 小林" autocomplete="off"></div>
      <div class="field"><label for="start">学期第1周的周一</label><input id="start" type="date" required></div>
      <div class="field"><label for="week">要填写第几周</label><input id="week" type="number" min="1" max="104" value="1"></div>
    </div>
    <p id="preset-hint" style="font-size:12px;margin:16px 0 0">请按组长约定核对学期日期和周次, 再填写名称并点格.</p>
    <div class="toolbar">
      <label class="check"><input type="checkbox" id="pairs" checked>两节连选, 适合连堂课程</label>
      <button id="clear" type="button">清空所选</button>
    </div>
    <div id="grid" aria-label="每周7天, 每天12节的忙闲格"></div>
    <div class="legend"><span><i class="dot"></i>已标记忙碌 / 其余为该周空闲</span><span id="count">已标记 0 节</span></div>
    <p style="font-size:12px;margin:15px 0">日期和周次请向组长确认. 默认按同校节次对齐; 有午休, 社团等安排也可标为忙碌.</p>
    <label class="check"><input type="checkbox" id="confirmed">我已核对学期日期, 周次和全部忙闲安排</label>
    <div class="actions"><button class="primary" id="generate" disabled>生成忙闲卡</button></div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </section>
  <section class="panel" id="output">
    <h2>你的忙闲卡</h2>
    <p style="margin-bottom:12px">复制完整短码或下载文件, 自行发送给组长. 此页面不会代你发送.</p>
    <textarea id="code" readonly aria-label="忙闲卡短码"></textarea>
    <div class="actions"><button class="primary" id="copy">复制短码</button><button id="download">下载 .busycard 文件</button></div>
  </section>
  <div class="foot">CourseFlow / 本地优先的课程工具</div>
</main>
<script id="card-codec">
(function(root){
  "use strict";
  function crc32(bytes){let value=0xffffffff;for(const byte of bytes){value^=byte;for(let bit=0;bit<8;bit++)value=(value>>>1)^((value&1)?0xedb88320:0);}return (value^0xffffffff)>>>0;}
  function validate(payload){
    if(!payload||payload.v!==1||typeof payload.name!=="string"||!payload.name.trim()||payload.name.length>80)throw new Error("请填写有效的成员名称.");
    if(!/^\d{4}-\d{2}-\d{2}$/.test(payload.start))throw new Error("请填写学期第1周周一的日期.");
    const day=new Date(payload.start+"T00:00:00Z");
    if(!Number.isFinite(day.getTime())||day.toISOString().slice(0,10)!==payload.start||day.getUTCDay()!==1)throw new Error("学期起始日期必须是有效的周一.");
    if(!payload.busy||Array.isArray(payload.busy)||Object.keys(payload.busy).length<1||Object.keys(payload.busy).length>104)throw new Error("请提供有效周次.");
    for(const [week,cells] of Object.entries(payload.busy)){
      if(!/^[1-9]\d*$/.test(week)||Number(week)>104||!Array.isArray(cells)||cells.some(n=>!Number.isInteger(n)||n<0||n>83))throw new Error("周次或忙闲格超出范围.");
    }
    return payload;
  }
  function encode(payload){
    validate(payload);
    const bytes=new TextEncoder().encode(JSON.stringify(payload));let binary="";
    for(let i=0;i<bytes.length;i+=16000)binary+=String.fromCharCode(...bytes.slice(i,i+16000));
    return "CF1."+btoa(binary).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"")+"."+crc32(bytes).toString(16).padStart(8,"0");
  }
  function decode(code){
    if(code.length>250000)throw new Error("忙闲卡过大.");
    const parts=code.trim().split(".");
    if(parts.length!==3||parts[0]!=="CF1"||!/^[A-Za-z0-9_-]+$/.test(parts[1]))throw new Error("忙闲卡格式不正确.");
    const raw=atob(parts[1].replace(/-/g,"+").replace(/_/g,"/"));const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));
    if(crc32(bytes).toString(16).padStart(8,"0")!==parts[2].toLowerCase())throw new Error("忙闲卡校验失败.");
    return validate(JSON.parse(new TextDecoder("utf-8",{fatal:true}).decode(bytes)));
  }
  root.CourseFlowCard={encode,decode,validate};
})(typeof window!=="undefined"?window:globalThis);
</script>
<script>
(function(){
  "use strict";
  const $=id=>document.getElementById(id),selected=new Set(),buttons=new Map(),days=["周一","周二","周三","周四","周五","周六","周日"];
  let periodTimes={},pageTimezone="Asia/Shanghai",defaults={};
  const params=new URLSearchParams(location.search);
  try{const data=JSON.parse($("courseflow-defaults").textContent||"{}");if(data&&typeof data==="object"&&!Array.isArray(data))defaults=data;}catch(error){defaults={};}
  $("start").value=params.get("start")??defaults.start??"";
  $("week").value=params.get("week")??defaults.week??1;
  const zone=params.get("timezone")??defaults.timezone;
  if(typeof zone==="string"&&zone.length<=80)pageTimezone=zone;
  try{const data=params.has("times")?JSON.parse(params.get("times")):(defaults.period_times||{});for(const [key,value] of Object.entries(data)){if(/^(?:[1-9]|1[0-2])$/.test(key)&&typeof value==="string"&&/^\d{2}:\d{2}-\d{2}:\d{2}$/.test(value))periodTimes[key]=value;}}catch(error){periodTimes={};}
  if($("start").value)$("preset-hint").textContent="已预填第 "+$("week").value+" 周, 学期第1周周一为 "+$("start").value+". "+(Object.keys(periodTimes).length?"已附学校作息, 请核对后填写.":"未提供钟点, 请按组长约定的节次填写.");
  function invalidated(){ $("confirmed").checked=false;$("generate").disabled=true;$("output").style.display="none";$("status").textContent=""; }
  function redraw(){for(const [cell,button] of buttons){const busy=selected.has(cell);button.setAttribute("aria-pressed",String(busy));button.textContent=busy?"忙":"";}$("count").textContent="已标记 "+selected.size+" 节";}
  const grid=$("grid");grid.appendChild(document.createElement("span"));
  for(const day of days){const element=document.createElement("div");element.className="weekday";element.textContent=day;grid.appendChild(element);}
  for(let period=1;period<=12;period++){
    const number=document.createElement("div");number.className="period";number.textContent=String(period);grid.appendChild(number);
    for(let day=0;day<7;day++){
      const cell=day*12+period-1,button=document.createElement("button");button.type="button";button.className="cell";button.setAttribute("aria-pressed","false");button.setAttribute("aria-label",days[day]+"第"+period+"节");
      button.addEventListener("click",()=>{const busy=!selected.has(cell);const cells=$("pairs").checked?[day*12+Math.floor((period-1)/2)*2,day*12+Math.floor((period-1)/2)*2+1]:[cell];for(const item of cells){if(busy)selected.add(item);else selected.delete(item);}invalidated();redraw();});
      buttons.set(cell,button);grid.appendChild(button);
    }
  }
  for(const id of ["name","start","week"])$(id).addEventListener("input",invalidated);
  $("clear").addEventListener("click",()=>{selected.clear();invalidated();redraw();});
  $("confirmed").addEventListener("change",()=>{$("generate").disabled=!$("confirmed").checked;});
  $("generate").addEventListener("click",()=>{
    try{
      const week=Number($("week").value);if(!Number.isInteger(week)||week<1||week>104)throw new Error("周次应在1-104之间.");
      const payload={v:1,name:$("name").value.trim(),start:$("start").value,busy:{[String(week)]:[...selected].sort((a,b)=>a-b)},period_times:periodTimes,timezone:pageTimezone,campus:""};
      $("code").value=CourseFlowCard.encode(payload);$("output").style.display="block";$("status").style.color="#18835b";$("status").textContent="忙闲卡已在本机生成, 请自行分享.";$("output").scrollIntoView({behavior:"smooth",block:"nearest"});
    }catch(error){$("status").style.color="#b44444";$("status").textContent=error.message;}
  });
  $("copy").addEventListener("click",async()=>{try{if(navigator.clipboard)await navigator.clipboard.writeText($("code").value);else{$("code").select();if(!document.execCommand("copy"))throw new Error("copy");}$("copy").textContent="已复制";}catch(error){$("code").focus();$("code").select();$("copy").textContent="请手动复制选中的短码";}});
  $("download").addEventListener("click",()=>{const url=URL.createObjectURL(new Blob([$("code").value+"\n"],{type:"text/plain;charset=utf-8"}));const link=document.createElement("a");link.href=url;link.download="CourseFlow-第"+$("week").value+"周.busycard";link.click();setTimeout(()=>URL.revokeObjectURL(url),2000);});
})();
</script>
</body>
</html>
